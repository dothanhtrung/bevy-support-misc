[package]
name = "bevy_support_misc"
version = "0.3.0"
authors = ["Trung Do <dothanhtrung@pm.me>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/kimtinh/bevy-support-misc.git"
keywords = ["bevy"]
description = "My tiny common code to share between bevy game projects"
exclude = ["assets", "examples", "tests", ".cargo"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.15", features = ["bevy_ui", "bevy_color", "bevy_text"], default-features = false }
serde = { version = "1.0", optional = true }
bincode = { version = "2.0", features = ["serde"], optional = true }
anyhow = { version = "1.0", optional = true }
simple_crypt = { version = "0.2", optional = true }
dirs = { version = "6.0", optional = true }

[dev-dependencies]
bevy = { version = "0.15" }

[features]
default = ["save", "setting"]
3d = []
save = ["simple_crypt", "bincode", "serde", "anyhow", "dirs"]
setting = ["serde", "anyhow", "dirs"]